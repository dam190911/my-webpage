<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 시작 홈페이지</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      color: #2f3542;
      background: linear-gradient(135deg, #f7f8fc 0%, #eef3ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }
    .container {
      width: min(920px, 100%);
    }
    .greeting {
      text-align: center;
      margin-bottom: 28px;
    }
    .greeting h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 42px);
      letter-spacing: -1.5px;
    }
    .greeting p {
      margin: 0;
      color: #7a8293;
      font-size: 15px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1.25fr;
      gap: 18px;
    }
    .card {
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 12px 35px rgba(67, 76, 103, .09);
      backdrop-filter: blur(8px);
    }
    .time-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 230px;
    }
    .label {
      color: #8a92a3;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    #time {
      font-size: clamp(38px, 7vw, 62px);
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
    }
    #date {
      margin-top: 13px;
      color: #687185;
      font-size: 15px;
    }
    .search-card {
      grid-column: 1 / -1;
    }
    .search-box {
      display: flex;
      gap: 10px;
    }
    .search-box input {
      flex: 1;
      min-width: 0;
      border: 1px solid #dfe3ec;
      border-radius: 13px;
      padding: 14px 16px;
      font-size: 15px;
      outline: none;
      transition: .2s;
    }
    .search-box input:focus {
      border-color: #91a9ff;
      box-shadow: 0 0 0 3px rgba(145,169,255,.15);
    }
    button {
      border: 0;
      border-radius: 13px;
      padding: 0 20px;
      background: #617be8;
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s, opacity .15s;
    }
    button:hover { opacity: .9; }
    button:active { transform: scale(.97); }

    .todo-card {
      min-height: 230px;
    }
    .todo-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .todo-title h2 {
      margin: 0;
      font-size: 19px;
    }
    #count {
      color: #8a92a3;
      font-size: 12px;
    }
    .add-todo {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    .add-todo input {
      flex: 1;
      min-width: 0;
      border: 1px solid #dfe3ec;
      border-radius: 11px;
      padding: 11px 13px;
      outline: none;
      font-size: 14px;
    }
    .add-todo button {
      padding: 0 15px;
      border-radius: 11px;
    }
    #todoList {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 11px;
      border-radius: 11px;
      background: #f7f8fc;
      font-size: 14px;
    }
    .todo-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: #617be8;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .todo-text {
      flex: 1;
      word-break: break-word;
    }
    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #a2a8b5;
    }
    .delete {
      border: 0;
      background: transparent;
      color: #a2a8b5;
      padding: 3px 6px;
      font-size: 16px;
      cursor: pointer;
    }
    .empty {
      text-align: center;
      color: #a2a8b5;
      font-size: 13px;
      padding: 12px 0;
    }
    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      .search-card { grid-column: auto; }
      .time-card, .todo-card { min-height: auto; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="greeting">
      <h1>안녕하세요 👋</h1>
      <p>오늘도 차근차근, 하고 싶은 일을 시작해 보세요.</p>
    </header>

    <section class="grid">
      <div class="card time-card">
        <div class="label">TODAY</div>
        <div id="time">00:00:00</div>
        <div id="date">날짜를 불러오는 중...</div>
      </div>

      <div class="card todo-card">
        <div class="todo-title">
          <h2>오늘의 할 일</h2>
          <span id="count">0개</span>
        </div>
        <div class="add-todo">
          <input id="todoInput" type="text" placeholder="할 일을 입력하세요" maxlength="100">
          <button id="addBtn">추가</button>
        </div>
        <ul id="todoList"></ul>
      </div>

      <div class="card search-card">
        <div class="label">GOOGLE SEARCH</div>
        <form class="search-box" id="searchForm">
          <input id="searchInput" type="search" placeholder="Google에서 검색하기" autocomplete="off">
          <button type="submit">검색</button>
        </form>
      </div>
    </section>
  </main>

  <script>
    // 현재 날짜와 시간
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      });
      const date = now.toLocaleDateString("ko-KR", {
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      });
      document.getElementById("time").textContent = time;
      document.getElementById("date").textContent = date;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // Google 검색
    document.getElementById("searchForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const query = document.getElementById("searchInput").value.trim();
      if (query) {
        window.location.href =
          "https://www.google.com/search?q=" + encodeURIComponent(query);
      }
    });

    // 오늘의 할 일: 브라우저 localStorage에 저장
    const input = document.getElementById("todoInput");
    const list = document.getElementById("todoList");
    const count = document.getElementById("count");
    let todos = JSON.parse(localStorage.getItem("myTodos") || "[]");

    function saveTodos() {
      localStorage.setItem("myTodos", JSON.stringify(todos));
    }

    function renderTodos() {
      list.innerHTML = "";
      const remaining = todos.filter(todo => !todo.done).length;
      count.textContent = remaining + "개 남음";

      if (todos.length === 0) {
        list.innerHTML = '<li class="empty">오늘 할 일을 추가해 보세요 ✨</li>';
        return;
      }

      todos.forEach((todo, index) => {
        const li = document.createElement("li");
        li.className = "todo-item" + (todo.done ? " done" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          todos[index].done = checkbox.checked;
          saveTodos();
          renderTodos();
        });

        const span = document.createElement("span");
        span.className = "todo-text";
        span.textContent = todo.text;

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "×";
        del.title = "삭제";
        del.addEventListener("click", () => {
          todos.splice(index, 1);
          saveTodos();
          renderTodos();
        });

        li.append(checkbox, span, del);
        list.appendChild(li);
      });
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      input.value = "";
      saveTodos();
      renderTodos();
      input.focus();
    }

    document.getElementById("addBtn").addEventListener("click", addTodo);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") addTodo();
    });

    renderTodos();
  </script>
</body>
</html>
